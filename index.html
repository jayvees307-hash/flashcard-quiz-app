<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="An interactive flashcard quiz with a custom deck creator and mastery tracking.">
<title>Flashcard Quiz</title>

<!-- Tailwind CSS (CDN) and Lucide icons (CDN), versions pinned -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">

<script>
  // Extend Tailwind with our palette and font
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Manrope', 'system-ui', 'sans-serif'] },
      colors: {
        ink: '#0d1117', panel: '#161b26', edge: '#262d3d',
        iris: '#8b9cff', mint: '#4ade9a', amber: '#f5b84b'
      }
    } }
  };
</script>

<style>
  html { color-scheme: dark; }

  /* ---- 3D flip card ---- */
  .scene { perspective: 1200px; }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.4, .2, .2, 1);
  }
  .card-inner.flipped { transform: rotateY(180deg); }

  /* Each face is a flex column. The label sits at the top, the hint at the
     bottom, and the text uses `margin: auto` to center itself between them.
     Unlike justify-content:center, auto margins never push overflowing text
     above the scroll area, so long cards scroll from the top instead of
     being clipped. */
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding: 1.25rem 1.5rem; text-align: center;
    overflow-y: auto; overscroll-behavior: contain;
  }
  .face.back { transform: rotateY(180deg); }
  .face > .label, .face > .hint { flex: none; }
  .face > .text {
    margin: auto 0; width: 100%;
    white-space: pre-line;            /* keep line breaks the user typed */
    overflow-wrap: anywhere;          /* break very long words / URLs */
  }

  /* Respect users who prefer reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .card-inner, .bar { transition: none !important; }
  }
  .bar { transition: width .35s ease; }
  :focus-visible { outline: 2px solid #8b9cff; outline-offset: 3px; }
</style>
</head>

<body class="bg-ink text-slate-200 font-sans min-h-screen antialiased">
<noscript>
  <p class="p-6 text-center">This flashcard app needs JavaScript enabled.</p>
</noscript>

<main class="max-w-2xl mx-auto px-4 py-8 sm:py-12">

  <!-- Header -->
  <header class="flex items-center justify-between mb-6">
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Flashcard Quiz</h1>
    <button id="resetBtn" class="text-sm text-slate-400 hover:text-white flex items-center gap-1.5 px-3 py-1.5 rounded-lg hover:bg-panel">
      <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset progress
    </button>
  </header>

  <!-- Progress tracker -->
  <section aria-label="Progress" class="mb-5">
    <div class="flex justify-between text-sm mb-2">
      <span id="progressText" class="font-semibold text-white" aria-live="polite">Card 1 of 5</span>
      <span id="statusBadge" class="text-slate-400">Not rated yet</span>
    </div>
    <div class="h-2 rounded-full bg-panel overflow-hidden" role="progressbar" aria-label="Position in deck">
      <div id="progressBar" class="bar h-full bg-iris rounded-full" style="width:0%"></div>
    </div>
  </section>

  <!-- Flip card -->
  <section class="scene h-80 sm:h-96 mb-5">
    <div id="card" class="card-inner cursor-pointer" role="button" tabindex="0" aria-pressed="false"
         aria-label="Flashcard. Press Space or click to flip.">
      <div id="frontFace" class="face front bg-panel border border-edge rounded-3xl shadow-2xl shadow-black/40">
        <span class="label text-xs text-iris font-semibold mb-3 flex items-center gap-1.5">
          <i data-lucide="help-circle" class="w-4 h-4"></i> Question
        </span>
        <p id="frontText" class="text"></p>
        <span class="hint mt-3 text-xs text-slate-500">Click or press Space to flip</span>
      </div>
      <div id="backFace" class="face back bg-[#1b2133] border border-iris/40 rounded-3xl shadow-2xl shadow-black/40" aria-hidden="true">
        <span class="label text-xs text-mint font-semibold mb-3 flex items-center gap-1.5">
          <i data-lucide="check-circle-2" class="w-4 h-4"></i> Answer
        </span>
        <p id="backText" class="text"></p>
      </div>
    </div>
  </section>

  <!-- Navigation controls -->
  <section class="grid grid-cols-3 gap-3 mb-3">
    <button id="prevBtn" class="flex items-center justify-center gap-2 py-3 rounded-xl bg-panel border border-edge hover:border-iris/60 font-semibold disabled:opacity-40 disabled:cursor-not-allowed">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Previous
    </button>
    <button id="shuffleBtn" class="flex items-center justify-center gap-2 py-3 rounded-xl bg-panel border border-edge hover:border-iris/60 font-semibold disabled:opacity-40 disabled:cursor-not-allowed">
      <i data-lucide="shuffle" class="w-4 h-4"></i> Shuffle
    </button>
    <button id="nextBtn" class="flex items-center justify-center gap-2 py-3 rounded-xl bg-iris text-ink hover:brightness-110 font-semibold disabled:opacity-40 disabled:cursor-not-allowed">
      Next <i data-lucide="arrow-right" class="w-4 h-4"></i>
    </button>
  </section>

  <!-- Mastery buttons -->
  <section class="grid grid-cols-2 gap-3 mb-5">
    <button id="reviewBtn" class="flex items-center justify-center gap-2 py-3 rounded-xl border border-amber/50 text-amber hover:bg-amber/10 font-semibold disabled:opacity-40 disabled:cursor-not-allowed">
      <i data-lucide="repeat" class="w-4 h-4"></i> Needs review
    </button>
    <button id="masterBtn" class="flex items-center justify-center gap-2 py-3 rounded-xl border border-mint/50 text-mint hover:bg-mint/10 font-semibold disabled:opacity-40 disabled:cursor-not-allowed">
      <i data-lucide="check" class="w-4 h-4"></i> Mark as mastered
    </button>
  </section>

  <!-- Mastery tracker -->
  <section aria-label="Mastery" class="rounded-2xl bg-panel border border-edge p-4 mb-10">
    <div class="flex flex-wrap gap-x-6 gap-y-1 text-sm mb-3">
      <span class="text-mint font-semibold"><span id="masteredCount">0</span> mastered</span>
      <span class="text-amber font-semibold"><span id="reviewCount">0</span> need review</span>
      <span class="text-slate-400"><span id="unratedCount">0</span> not rated</span>
    </div>
    <div class="h-2 rounded-full bg-edge overflow-hidden flex">
      <div id="masteredBar" class="bar h-full bg-mint" style="width:0%"></div>
      <div id="reviewBar" class="bar h-full bg-amber" style="width:0%"></div>
    </div>
  </section>

  <!-- Custom deck creator -->
  <section aria-label="Add a card" class="rounded-2xl bg-panel border border-edge p-5 mb-6">
    <h2 class="text-lg font-bold text-white mb-4">Add your own card</h2>
    <div class="space-y-3">
      <div>
        <label for="qInput" class="block text-sm text-slate-400 mb-1">Question</label>
        <textarea id="qInput" rows="2" autocomplete="off" class="w-full rounded-xl bg-ink border border-edge px-3 py-2 text-white placeholder-slate-600 focus:border-iris focus:outline-none" placeholder="What does CSS stand for?"></textarea>
      </div>
      <div>
        <label for="aInput" class="block text-sm text-slate-400 mb-1">Answer</label>
        <textarea id="aInput" rows="2" autocomplete="off" class="w-full rounded-xl bg-ink border border-edge px-3 py-2 text-white placeholder-slate-600 focus:border-iris focus:outline-none" placeholder="Cascading Style Sheets"></textarea>
      </div>
      <p id="formError" role="alert" class="text-sm text-amber hidden"></p>
      <button id="addBtn" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-iris text-ink font-semibold hover:brightness-110">
        <i data-lucide="plus" class="w-4 h-4"></i> Add card
      </button>
    </div>
  </section>

  <!-- List of custom cards (deletable) -->
  <section aria-label="Your cards" class="mb-10">
    <h2 class="text-lg font-bold text-white mb-3">Your cards</h2>
    <ul id="customList" class="space-y-2"></ul>
    <p id="customEmpty" class="text-sm text-slate-500">Cards you add appear here. Add one above to start building your deck.</p>
  </section>
</main>

<script>
/* =====================================================================
   Flashcard Quiz — vanilla JS

   State shape (saved to localStorage):
     customCards : [{id, q, a}]            user-created cards
     status      : { [cardId]: 'mastered' | 'review' }
     order       : [cardId, ...]           current deck order (shuffle result)
     index       : number                  current position in `order`

   Safety notes:
   - User text is only ever written with textContent / setAttribute, never
     innerHTML, so it cannot be parsed as markup.
   - Everything read back from localStorage is re-validated and sanitized,
     because storage can be edited by hand, by extensions, or corrupted.
   ===================================================================== */

const STORAGE_KEY = 'flashcard-quiz-v1';
const Q_MAX = 300;          // max characters in a question
const A_MAX = 500;          // max characters in an answer
const MAX_CUSTOM = 200;     // cap on user-created cards
const ID_RE = /^[a-z0-9]{1,40}$/i;   // ids are alphanumeric only

// ---- 1. Pre-loaded deck (5 CS / web dev cards) ----
const BASE_CARDS = [
  { id: 'b1', q: 'What does the "C" in CSS stand for, and what does it mean?',
    a: 'Cascading: when rules conflict, the browser resolves them by origin, specificity, and source order.' },
  { id: 'b2', q: 'What is the difference between == and === in JavaScript?',
    a: '== compares after type coercion; === compares value and type with no coercion. Prefer ===.' },
  { id: 'b3', q: 'What is the time complexity of binary search?',
    a: 'O(log n). It halves the search range each step, but requires a sorted collection.' },
  { id: 'b4', q: 'What does an HTTP 404 status code mean?',
    a: 'Not Found: the server is reachable but has no resource at the requested URL.' },
  { id: 'b5', q: 'What is a closure in JavaScript?',
    a: 'A function that keeps access to variables from the scope where it was created, even after that scope has finished running.' }
];

// ---- 2. Sanitizing helpers ----

/**
 * Normalize untrusted text: coerce to string, normalize line endings, strip
 * control characters plus zero-width and bidirectional-override characters
 * (used for text spoofing), limit blank lines, trim, and cap the length.
 * Newlines and tabs are kept; display uses white-space: pre-line.
 */
function clean(value, max) {
  return String(value == null ? '' : value)
    .replace(/\r\n?/g, '\n')
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim()
    .slice(0, max);
}

// ---- 3. State + persistence ----
let state = loadState();
let flipped = false;
let advanceTimer = null;   // pending auto-advance after rating a card
let renderTimer = null;    // pending text swap after a flip-back

/** Read saved state; validate every field and fall back to defaults on any problem. */
function loadState() {
  const fresh = { customCards: [], status: {}, order: [], index: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!saved || typeof saved !== 'object') return fresh;

    const baseIds = new Set(BASE_CARDS.map(c => c.id));
    const seen = new Set();
    const customCards = [];
    (Array.isArray(saved.customCards) ? saved.customCards : []).forEach(c => {
      if (!c || typeof c.id !== 'string' || !ID_RE.test(c.id)) return;
      if (baseIds.has(c.id) || seen.has(c.id)) return;        // no id collisions
      const q = clean(c.q, Q_MAX), a = clean(c.a, A_MAX);
      if (!q || !a) return;                                    // drop empty cards
      seen.add(c.id);
      customCards.push({ id: c.id, q, a });
    });

    const status = {};
    if (saved.status && typeof saved.status === 'object') {
      Object.keys(saved.status).forEach(id => {
        const v = saved.status[id];
        if (ID_RE.test(id) && (v === 'mastered' || v === 'review')) status[id] = v;
      });
    }

    return {
      customCards,
      status,
      order: Array.isArray(saved.order) ? saved.order.filter(id => typeof id === 'string') : [],
      index: Number.isInteger(saved.index) ? saved.index : 0
    };
  } catch (e) { return fresh; }   // storage blocked or JSON corrupted
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { /* ignore quota / private-mode errors; the app still works for this session */ }
}

/** All cards (built-in + custom). */
function allCards() { return [...BASE_CARDS, ...state.customCards]; }

/**
 * Make `state.order` match the real set of cards: drop unknown and duplicate
 * ids, append missing ones, and clamp the index (safe for an empty deck).
 */
function syncOrder() {
  const valid = new Set(allCards().map(c => c.id));
  const seen = new Set();
  const kept = state.order.filter(id => valid.has(id) && !seen.has(id) && seen.add(id));
  allCards().forEach(c => { if (!kept.includes(c.id)) kept.push(c.id); });
  state.order = kept;
  state.index = Math.min(Math.max(state.index, 0), Math.max(kept.length - 1, 0));
}

/** The card currently shown, or undefined if the deck is empty. */
function currentCard() {
  const id = state.order[state.index];
  return allCards().find(c => c.id === id);
}

// ---- 4. DOM references ----
const $ = id => document.getElementById(id);
const cardEl = $('card');
const CONTROL_IDS = ['prevBtn', 'nextBtn', 'shuffleBtn', 'masterBtn', 'reviewBtn'];

// ---- 5. Rendering ----

/** Pick a text size class so long cards stay readable without overflowing early. */
function sizeClass(len, isFront) {
  const tone = isFront ? 'font-semibold text-white leading-snug' : 'text-slate-100 leading-relaxed';
  const size = len > 260 ? 'text-sm sm:text-base' : len > 120 ? 'text-base sm:text-lg' : 'text-xl sm:text-2xl';
  return `text ${size} ${tone}`;
}

function renderCard() {
  const card = currentCard();
  const frontEl = $('frontText'), backEl = $('backText');

  if (!card) {
    // Empty-deck state: nothing to study yet
    frontEl.textContent = 'No cards yet. Add one below to get started.';
    frontEl.className = sizeClass(0, true);
    backEl.textContent = '';
  } else {
    frontEl.textContent = card.q;      // textContent: never parsed as HTML
    backEl.textContent = card.a;
    frontEl.className = sizeClass(card.q.length, true);
    backEl.className = sizeClass(card.a.length, false);
  }
  $('frontFace').scrollTop = 0;        // long cards always start at the top
  $('backFace').scrollTop = 0;
  renderProgress();
}

function renderProgress() {
  const total = state.order.length;
  const card = currentCard();
  const empty = !card;

  // Disable controls when there is nothing to act on
  CONTROL_IDS.forEach(id => { $(id).disabled = empty; });

  // Mastery totals (only count ids that exist in the deck)
  let mastered = 0, review = 0;
  state.order.forEach(id => {
    if (state.status[id] === 'mastered') mastered++;
    else if (state.status[id] === 'review') review++;
  });
  const pct = n => (total ? (n / total) * 100 : 0);   // avoids divide-by-zero
  $('masteredCount').textContent = mastered;
  $('reviewCount').textContent = review;
  $('unratedCount').textContent = total - mastered - review;
  $('masteredBar').style.width = `${pct(mastered)}%`;
  $('reviewBar').style.width = `${pct(review)}%`;

  if (empty) {
    $('progressText').textContent = 'No cards';
    $('progressBar').style.width = '0%';
    $('statusBadge').textContent = '';
    document.title = 'Flashcard Quiz';
    return;
  }

  $('progressText').textContent = `Card ${state.index + 1} of ${total}`;
  $('progressBar').style.width = `${pct(state.index + 1)}%`;
  document.title = `(${state.index + 1}/${total}) Flashcard Quiz`;   // dynamic tab title

  const s = state.status[card.id];
  const badge = $('statusBadge');
  badge.textContent = s === 'mastered' ? 'Mastered' : s === 'review' ? 'Needs review' : 'Not rated yet';
  badge.className = s === 'mastered' ? 'text-mint font-semibold'
                  : s === 'review' ? 'text-amber font-semibold' : 'text-slate-400';
}

/** Re-draw the list of custom cards with delete buttons. */
function renderCustomList() {
  const list = $('customList');
  list.innerHTML = '';   // safe: clearing only; all content below is built with DOM APIs
  state.customCards.forEach(c => {
    const li = document.createElement('li');
    li.className = 'flex items-start justify-between gap-3 rounded-xl bg-panel border border-edge px-4 py-3';

    const text = document.createElement('div');
    text.className = 'min-w-0';
    const q = document.createElement('p');
    q.className = 'font-semibold text-white truncate';
    q.textContent = c.q;
    const a = document.createElement('p');
    a.className = 'text-sm text-slate-400 truncate';
    a.textContent = c.a;
    text.append(q, a);

    const del = document.createElement('button');
    del.className = 'p-2 rounded-lg text-slate-400 hover:text-amber hover:bg-ink shrink-0';
    del.setAttribute('aria-label', 'Delete card: ' + c.q.slice(0, 60));
    del.innerHTML = '<i data-lucide="trash-2" class="w-4 h-4"></i>';   // static markup only
    del.addEventListener('click', () => deleteCard(c.id));

    li.append(text, del);
    list.appendChild(li);
  });
  $('customEmpty').classList.toggle('hidden', state.customCards.length > 0);
  refreshIcons();
}

/** Convert <i data-lucide> placeholders into SVG icons (safe if the CDN failed). */
function refreshIcons() { if (window.lucide) lucide.createIcons(); }

// ---- 6. Card interaction ----
function setFlipped(value) {
  flipped = value;
  cardEl.classList.toggle('flipped', flipped);
  cardEl.setAttribute('aria-pressed', String(flipped));
  // Hide the face that is turned away from assistive technology
  $('frontFace').setAttribute('aria-hidden', String(flipped));
  $('backFace').setAttribute('aria-hidden', String(!flipped));
}

function flip() {
  if (!currentCard()) return;     // nothing to flip in an empty deck
  setFlipped(!flipped);
}

/** Move to a card; flip back first so the next answer isn't visible mid-turn. */
function goTo(newIndex) {
  const total = state.order.length;
  if (!total) return;
  clearTimeout(advanceTimer);     // a manual move cancels any pending auto-advance
  clearTimeout(renderTimer);
  state.index = ((newIndex % total) + total) % total;   // wraps at both ends
  saveState();
  if (flipped) {
    setFlipped(false);
    renderTimer = setTimeout(renderCard, 220);   // swap text once the card is face-down
  } else {
    renderCard();
  }
}

function next() { goTo(state.index + 1); }
function prev() { goTo(state.index - 1); }

/** Fisher-Yates shuffle of the deck order. */
function shuffle() {
  if (state.order.length < 2) return;
  const o = state.order;
  for (let i = o.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [o[i], o[j]] = [o[j], o[i]];
  }
  goTo(0);
}

/** Mark the current card, then move on (unless it is the last card). */
function rate(value) {
  const card = currentCard();
  if (!card) return;
  state.status[card.id] = value;
  saveState();
  renderProgress();
  clearTimeout(advanceTimer);
  if (state.index < state.order.length - 1) advanceTimer = setTimeout(next, 250);
}

// ---- 7. Custom deck creator ----
function showFormError(msg) {
  const err = $('formError');
  err.textContent = msg;
  err.classList.toggle('hidden', !msg);
}

function addCard() {
  const q = clean($('qInput').value, Q_MAX);
  const a = clean($('aInput').value, A_MAX);

  if (!q || !a) return showFormError('Enter both a question and an answer.');
  if (state.customCards.length >= MAX_CUSTOM) return showFormError(`You can add up to ${MAX_CUSTOM} custom cards.`);
  const dup = allCards().some(c => c.q.toLowerCase() === q.toLowerCase() && c.a.toLowerCase() === a.toLowerCase());
  if (dup) return showFormError('That card is already in your deck.');
  showFormError('');

  const id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  state.customCards.push({ id, q, a });
  state.order.push(id);
  $('qInput').value = '';
  $('aInput').value = '';
  saveState();
  renderCustomList();
  renderCard();                 // also refreshes progress (and the empty state if the deck was empty)
  $('qInput').focus();          // ready for the next card
}

function deleteCard(id) {
  const cur = currentCard();
  const curId = cur ? cur.id : null;
  clearTimeout(advanceTimer);
  clearTimeout(renderTimer);
  state.customCards = state.customCards.filter(c => c.id !== id);
  delete state.status[id];
  syncOrder();
  if (curId && curId !== id) {
    // Keep showing the same card even though earlier positions shifted
    const i = state.order.indexOf(curId);
    if (i !== -1) state.index = i;
  } else {
    setFlipped(false);          // the shown card was removed; start fresh on its neighbor
  }
  saveState();
  renderCustomList();
  renderCard();
}

function resetProgress() {
  clearTimeout(advanceTimer);
  clearTimeout(renderTimer);
  state.status = {};
  state.index = 0;
  setFlipped(false);
  saveState();
  renderCard();
}

// ---- 8. Event wiring ----
cardEl.addEventListener('click', flip);
$('prevBtn').addEventListener('click', prev);
$('nextBtn').addEventListener('click', next);
$('shuffleBtn').addEventListener('click', shuffle);
$('masterBtn').addEventListener('click', () => rate('mastered'));
$('reviewBtn').addEventListener('click', () => rate('review'));
$('addBtn').addEventListener('click', addCard);
$('resetBtn').addEventListener('click', resetProgress);
['qInput', 'aInput'].forEach(id => $(id).addEventListener('input', () => showFormError('')));

// Enforce the same limits in the form that the JS sanitizer applies
$('qInput').maxLength = Q_MAX;
$('aInput').maxLength = A_MAX;

// Keyboard shortcuts for hands-free study:
//   Space = flip, Right Arrow = next, Left Arrow = previous.
// They work even when a button has focus (e.g. right after clicking "Next"),
// and are ignored only while typing in the "Add your own card" fields.
function isTyping(el) {
  return el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' || el.isContentEditable;
}

document.addEventListener('keydown', e => {
  if (isTyping(e.target) || e.ctrlKey || e.metaKey || e.altKey) return;
  switch (e.code) {
    case 'Space':
      e.preventDefault();          // stop page scroll and focused-button activation
      if (!e.repeat) flip();       // holding the key shouldn't flip repeatedly
      break;
    case 'ArrowRight': e.preventDefault(); next(); break;
    case 'ArrowLeft':  e.preventDefault(); prev(); break;
    case 'Enter':
      if (e.target === cardEl) { e.preventDefault(); flip(); }   // Enter also flips when the card has focus
      break;
  }
});

// Firefox fires a button's click on Space *keyup*, so block that too.
document.addEventListener('keyup', e => {
  if (e.code === 'Space' && !isTyping(e.target)) e.preventDefault();
});

// ---- 9. Init ----
syncOrder();
setFlipped(false);
renderCard();
renderCustomList();
refreshIcons();
</script>
</body>
</html>
